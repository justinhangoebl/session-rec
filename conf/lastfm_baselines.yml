# Session-aware baselines on LASTFM with the tuned parameters of Latifi et al. 2021 (Table A.14); reproduces their
# Table 6. vstan_eb uses lambda_spw 1.4525: the 0.4525 printed in Table A.14 misses the published numbers.
type: window
key: baselines
evaluation: evaluation_user_based
data:
  name: lastfm
  folder: data/lastfm/prepared/
  prefix: userid-timestamp-artid-artname-traid-traname
  type: hdf
  slices: 5
  skip: [0, 1, 2, 3]   # run the last slice only; remove to run all 5
results:
  folder: results/lastfm/
wandb:
  project: session-rec
  tags: [lastfm, baselines]
metrics:
- class: accuracy_multiple.Precision
  length: [3, 5, 10, 15, 20]
- class: accuracy_multiple.Recall
  length: [3, 5, 10, 15, 20]
- class: accuracy_multiple.MAP
  length: [3, 5, 10, 15, 20]
- class: accuracy_multiple.NDCG
  length: [3, 5, 10, 15, 20]
- class: accuracy.HitRate
  length: [3, 5, 10, 15, 20]
- class: accuracy.MRR
  length: [3, 5, 10, 15, 20]
- class: coverage.Coverage
  length: [20]
- class: popularity.Popularity
  length: [20]
- class: time_memory_usage.Time_usage_training
- class: time_memory_usage.Time_usage_testing
algorithms:
- class: baselines.sr.SequentialRules
  params: { steps: 8, weighting: quadratic }
  key: sr
- class: baselines.usr.USequentialRules
  params: { steps: 20, weighting: quadratic, boost_own_sessions: 3.1 }
  key: sr_b
- class: knn.vsknn.VMContextKNN
  params: { k: 50, sample_size: 500, weighting: quadratic, weighting_score: quadratic, idf_weighting: 5 }
  key: vsknn
- class: knn.uvsknn.UVMContextKNN
  params: { k: 50, sample_size: 500, weighting: quadratic, weighting_score: quadratic, idf_weighting: 1, extend_session_length: 3, boost_own_sessions: 2.5 }
  key: vsknn_eb
- class: knn.stan.STAN
  params: { k: 100, sample_size: 10000, lambda_spw: 1.0e-05, lambda_snh: 80, lambda_inh: 3.62 }
  key: stan
- class: knn.ustan.USTAN
  params: { k: 100, sample_size: 2500, lambda_spw: 1.0e-05, lambda_snh: 100, lambda_inh: 7.24, extend_session_length: 17, boost_own_sessions: 2.7, reminders: true, remind_strategy: hybrid, remind_sessions_num: 3, weight_base: 5, weight_IRec: 0, weight_SSim: 6 }
  key: stan_ebr
- class: knn.vstan.VSKNN_STAN
  params: { k: 1000, sample_size: 5000, similarity: cosine, lambda_spw: 1.81, lambda_snh: 100, lambda_inh: 1.81, lambda_ipw: 1.0e-05, lambda_idf: false }
  key: vstan
- class: knn.uvstan.U_VSKNN_STAN
  params: { k: 1000, sample_size: 10000, similarity: cosine, lambda_spw: 1.4525, lambda_snh: 100, lambda_inh: 3.62, lambda_ipw: 0.4525, lambda_idf: 5, extend_session_length: 7, boost_own_sessions: 3.7 }
  key: vstan_eb
