# LASTFM 1K (http://ocelma.net/MusicRecommendationDataset/lastfm-1K.html), session-aware, 5 slices as in
# Latifi et al. 2021. Put userid-timestamp-artid-artname-traid-traname.tsv (from lastfm-dataset-1K.tar.gz) into
# data/lastfm/raw/.
type: window
mode: session_aware
preprocessor: lastfm_aware
data:
  folder: data/lastfm/raw/
  prefix: userid-timestamp-artid-artname-traid-traname
filter:
  min_item_support: 5
  min_session_length: 2
  min_user_sessions: 3
  max_session_length: 20
params:
  num_slices: 5
  days_offset: 500
  days_shift: 217
  min_session_length: 2
output:
  folder: data/lastfm/prepared/
