# Non-neural baselines on RSC15, 5 slices, with the params of the original session-rec rsc15 window config
# (Ludewig et al. 2021). Data: conf/preprocess/rsc15_window.yml.
type: window
key: baselines
evaluation: evaluation
data:
  name: rsc15
  folder: data/rsc15/slices/
  prefix: yoochoose-clicks
  slices: 5
  skip: [0, 1, 2, 3]   # run the last slice only; remove to run all 5
results:
  folder: results/rsc15/
wandb:
  project: session-rec
  tags: [rsc15, baselines]
metrics:
- class: accuracy.HitRate
  length: [1, 3, 5, 10, 15, 20]
- class: accuracy.MRR
  length: [3, 5, 10, 15, 20]
- class: coverage.Coverage
  length: [20]
- class: popularity.Popularity
  length: [20]
- class: time_memory_usage.Time_usage_training
- class: time_memory_usage.Time_usage_testing
algorithms:
- class: baselines.pop.Pop
  key: pop
- class: baselines.markov.MarkovModel
  key: markov
- class: baselines.ar.AssociationRules
  key: ar
- class: baselines.sr.SequentialRules
  params: { steps: 8, weighting: div }
  key: sr
- class: knn.sknn.ContextKNN
  params: { k: 500, sample_size: 10000, similarity: jaccard }
  key: sknn
- class: knn.vsknn.VMContextKNN
  params: { k: 100, sample_size: 1000, weighting: quadratic, weighting_score: quadratic }
  key: vsknn
