type: window
key: gru4rec
evaluation: evaluation_user_based
data:
  name: lastfm
  folder: /home/justin-hangoebl/phd/session-rec/data/lastfm/window_port/
  prefix: userid-timestamp-artid-artname-traid-traname
  type: hdf
  slices: 5
  skip:
  - 1
  - 2
  - 3
  - 4
results:
  folder: /home/justin-hangoebl/phd/session-rec/results/latifi_lastfm/neural/gru4rec/seed2/
metrics:
- class: accuracy_multiple.Precision
  length: &id001
  - 3
  - 5
  - 10
  - 15
  - 20
- class: accuracy_multiple.Recall
  length: *id001
- class: accuracy_multiple.MAP
  length: *id001
- class: accuracy_multiple.NDCG
  length: *id001
- class: accuracy.HitRate
  length: *id001
- class: accuracy.MRR
  length: *id001
- class: coverage.Coverage
  length:
  - 20
- class: popularity.Popularity
  length:
  - 20
- class: time_memory_usage.Time_usage_training
- class: time_memory_usage.Time_usage_testing
algorithms:
- class: gru4rec_torch.adapter.GRU4RecTorch
  params:
    loss: bpr-max
    elu_param: 0
    layers:
    - 100
    n_epochs: 10
    batch_size: 100
    dropout_p_embed: 0.0
    dropout_p_hidden: 0.0
    learning_rate: 0.04
    momentum: 0.1
    n_sample: 2048
    sample_alpha: 0.75
    bpreg: 1.0
    logq: 0.0
    embedding: 0
    constrained_embedding: false
    seed: 2
    device: cuda:0
  key: gru4rec
