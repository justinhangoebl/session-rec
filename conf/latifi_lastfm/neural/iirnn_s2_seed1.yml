type: window
key: iirnn
evaluation: evaluation_user_based
data:
  name: lastfm
  folder: /home/justin-hangoebl/phd/session-rec/data/lastfm/window_port/
  prefix: userid-timestamp-artid-artname-traid-traname
  type: hdf
  slices: 5
  skip:
  - 0
  - 1
  - 3
  - 4
results:
  folder: /home/justin-hangoebl/phd/session-rec/results/latifi_lastfm/neural/iirnn/seed1/
metrics:
- class: accuracy_multiple.Precision
  length: &id001
  - 3
  - 5
  - 10
  - 15
  - 20
- class: accuracy_multiple.Recall
  length: *id001
- class: accuracy_multiple.MAP
  length: *id001
- class: accuracy_multiple.NDCG
  length: *id001
- class: accuracy.HitRate
  length: *id001
- class: accuracy.MRR
  length: *id001
- class: coverage.Coverage
  length:
  - 20
- class: popularity.Popularity
  length:
  - 20
- class: time_memory_usage.Time_usage_training
- class: time_memory_usage.Time_usage_testing
algorithms:
- class: IIRNN_torch.ii_rnn.IIRNN
  params:
    learning_rate: 0.001
    dropout_pkeep: 0.6
    embedding_size: 100
    use_last_hidden_state: true
    max_session_representation: 20
    max_epoch: 100
    seed: 1
    device: cuda:0
  key: iirnn
