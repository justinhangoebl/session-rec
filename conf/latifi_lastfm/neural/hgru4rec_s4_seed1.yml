type: window
key: hgru4rec
evaluation: evaluation_user_based
data:
  name: lastfm
  folder: /home/justin-hangoebl/phd/session-rec/data/lastfm/window_port/
  prefix: userid-timestamp-artid-artname-traid-traname
  type: hdf
  slices: 5
  skip:
  - 0
  - 1
  - 2
  - 3
results:
  folder: /home/justin-hangoebl/phd/session-rec/results/latifi_lastfm/neural/hgru4rec/seed1/
metrics:
- class: accuracy_multiple.Precision
  length: &id001
  - 3
  - 5
  - 10
  - 15
  - 20
- class: accuracy_multiple.Recall
  length: *id001
- class: accuracy_multiple.MAP
  length: *id001
- class: accuracy_multiple.NDCG
  length: *id001
- class: accuracy.HitRate
  length: *id001
- class: accuracy.MRR
  length: *id001
- class: coverage.Coverage
  length:
  - 20
- class: popularity.Popularity
  length:
  - 20
- class: time_memory_usage.Time_usage_training
- class: time_memory_usage.Time_usage_testing
algorithms:
- class: hgru4rec_torch.hgru4rec.HGRU4Rec
  params:
    final_act: linear
    dropout_p_hidden_usr: 0.7
    dropout_p_hidden_ses: 0.1
    dropout_p_init: 0.3
    momentum: 0.5
    learning_rate: 0.09
    user_propagation_mode: all
    batch_size: 50
    torch_seed: 1
    device: cpu
  key: hgru4rec
