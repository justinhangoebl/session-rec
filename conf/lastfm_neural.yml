# EASE, SASRec and the neural models on LASTFM (tuned parameters of Latifi et al. 2021 where they exist), seed 1. Set device: cpu without a GPU.
type: window
key: neural
evaluation: evaluation_user_based
data:
  name: lastfm
  folder: data/lastfm/prepared/
  prefix: userid-timestamp-artid-artname-traid-traname
  type: hdf
  slices: 5
  skip: [0, 1, 2, 3]   # run the last slice only; remove to run all 5
results:
  folder: output/lastfm/
wandb:
  project: session-rec
  tags: [lastfm, neural]
metrics:
- class: accuracy_multiple.Precision
  length: [5, 10, 20]
- class: accuracy_multiple.Recall
  length: [5, 10, 20]
- class: accuracy_multiple.MAP
  length: [5, 10, 20]
- class: accuracy_multiple.NDCG
  length: [5, 10, 20]
- class: accuracy.HitRate
  length: [5, 10, 20]
- class: accuracy.MRR
  length: [5, 10, 20]
- class: coverage.Coverage
  length: [20]
- class: popularity.Popularity
  length: [20]
- class: time_memory_usage.Time_usage_training
- class: time_memory_usage.Time_usage_testing
algorithms:
# EASE: history + prefix query. history_weight / recency_decay are a first guess from a sweep on the slice-4 test
# set (HR@20 0.487, MRR@20 0.223); tune them on the validation split before reporting.
- class: ease.ease.EASE
  params: { l2: 500, use_history: true, history_weight: 1.0, recency_decay: 0.5, device: 'cuda:0' }
  key: ease
- class: sasrec.sasrec.SASRec
  # sessions are cut to 20 events in preprocessing (max_session_length), so longer sequences are only padding
  params: { hidden_units: 50, max_seq_length: 20, num_blocks: 2, num_heads: 1, dropout_rate: 0.2, batch_size: 128, learning_rate: 0.001, l2_emb: 0.0, n_epochs: 150, loss: cross-entropy, n_sample: 1, seed: 1, device: 'cuda:0' }
  key: sasrec
- class: gru4rec.adapter.GRU4RecTorch
  params: { loss: bpr-max, elu_param: 0, layers: [100], n_epochs: 10, batch_size: 100, dropout_p_embed: 0.0, dropout_p_hidden: 0.0, learning_rate: 0.04, momentum: 0.1, n_sample: 2048, sample_alpha: 0.75, bpreg: 1.0, logq: 0.0, embedding: 0, constrained_embedding: false, seed: 1, device: 'cuda:0' }
  key: gru4rec
