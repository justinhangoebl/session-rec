type: single # single|window|opt
key: baselines_and_models #added to the csv names
evaluation: evaluation_user_based # evaluation_user_based
data:
  name: rsc15-users
  folder: data/rsc15_users/prepared/
  prefix: yoochoose-clicks-100k
#  slices: 5 #only window
#  skip: [0,3] #only window

results:
  folder: results/port/aware-neural/ii_rnn/seed2/

metrics:
- class: accuracy_multiple.MAP
  length: [10,20]
- class: accuracy_multiple.Precision
  length: [10,20]
- class: accuracy_multiple.Recall
  length: [10,20]
- class: accuracy.HitRate
  length: [10,20]
- class: accuracy.MRR
  length: [10,20]
- class: saver.Saver
  length: [50]
- class: coverage.Coverage
  length: [20]
- class: popularity.Popularity
  length: [20]

algorithms:
- class: IIRNN_torch.ii_rnn.IIRNN
  params: { learning_rate: 0.002, dropout_pkeep: 0.4, embedding_size: 100, use_last_hidden_state: False, max_session_representation: 15, max_epoch: 100, seed: 2, device: 'cuda:0' }
  key: ii_rnn
